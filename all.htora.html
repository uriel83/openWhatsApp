<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>עול תורה - סרטוני הערוץ</title>

<style>

:root{
    --bg:#0f1830;
    --card:#1b2545;
    --gold:#d4a04d;
    --gold-light:#f0c97a;
    --burgundy:#6b1f2d;
    --burgundy-light:#8e2b3d;
    --text:#ffffff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#22365e 0%,#0f1830 60%);
    color:var(--text);
}

header{
    text-align:center;
    padding:30px 15px;
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:auto;
    display:block;
    box-shadow:0 0 30px rgba(212,160,77,.4);
}

header h1{
    margin:15px 0 5px;
    color:var(--gold-light);
}

header p{
    color:#d6d6d6;
}

#videos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
    padding:20px;
    max-width:1400px;
    margin:auto;
}

.card{
    background:linear-gradient(
        180deg,
        rgba(107,31,45,.95),
        rgba(27,37,69,.95)
    );

    border:1px solid rgba(212,160,77,.3);

    border-radius:18px;
    overflow:hidden;

    cursor:pointer;

    transition:.35s;

    box-shadow:
        0 8px 20px rgba(0,0,0,.35);
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:
        0 15px 35px rgba(212,160,77,.25);
}

.thumb{
    width:100%;
    display:block;
}

.content{
    padding:14px;
}

.title{
    font-size:15px;
    line-height:1.5;
    font-weight:bold;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:999;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:1000px;

    background:linear-gradient(
        135deg,
        #142140,
        #28131a
    );

    border:1px solid rgba(212,160,77,.4);

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 0 40px rgba(0,0,0,.6);
}

#close{
    position:absolute;
    top:20px;
    left:25px;
    font-size:38px;
    color:white;
    cursor:pointer;
}

#modalPlayer iframe{
    width:100%;
    height:550px;
    border:none;
}

.loading{
    text-align:center;
    padding:40px;
    color:var(--gold-light);
}

@media(max-width:700px){

    #modalPlayer iframe{
        height:300px;
    }

    header h1{
        font-size:24px;
    }
}

</style>
</head>
<body>

<header>

    <!-- <img
        class="logo"
        src="https://i.imgur.com/qJt4f4m.png"
        alt="לוגו"> -->

    <h1>עול תורה</h1>
<P>שעורים בסדר הדף היומי ע"י הרה"ג אברהם משה רוט שליט"א</P>
</header>

<div id="videos">
    <div class="loading">טוען סרטונים...</div>
</div>

<div id="modal" class="modal">

    <span id="close">&times;</span>

    <div class="modal-content">
        <div id="modalPlayer"></div>
    </div>

</div>

<script>

const API_KEY = "YOUR_API_KEY";

const CHANNEL_ID =
"UCzMKm2dTY7mNRbD6VZdndLg";

function openModal(videoId){

    document.getElementById("modalPlayer").innerHTML =
    `
    <iframe
    src="https://www.youtube.com/embed/${videoId}?autoplay=1"
    allowfullscreen>
    </iframe>
    `;

    document.getElementById("modal").style.display="flex";
}

function closeModal(){

    document.getElementById("modal").style.display="none";

    document.getElementById("modalPlayer").innerHTML="";
}

async function getUploadsPlaylist(){

    const res = await fetch(
    `https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${CHANNEL_ID}&key=${API_KEY}`
    );

    const data = await res.json();

    return data.items?.[0]
        ?.contentDetails
        ?.relatedPlaylists
        ?.uploads;
}

async function loadVideos(){

    const uploads =
        await getUploadsPlaylist();

    if(!uploads) return;

    const res = await fetch(
    `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${uploads}&key=${API_KEY}`
    );

    const data = await res.json();

    render(data.items || []);
}

function render(items){

    const container =
        document.getElementById("videos");

    container.innerHTML="";

    items.forEach(item=>{

        const s = item.snippet;

        const videoId =
        s.resourceId.videoId;

        const card =
        document.createElement("div");

        card.className="card";

        card.innerHTML=`
        <img
        class="thumb"
        src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg">

        <div class="content">
            <div class="title">
                ${s.title}
            </div>
        </div>
        `;

        card.onclick=()=>openModal(videoId);

        container.appendChild(card);
    });
}

document.getElementById("close")
.addEventListener("click",closeModal);

document.getElementById("modal")
.addEventListener("click",e=>{

    if(e.target.id==="modal"){
        closeModal();
    }
});

loadVideos();

</script>

</body>
</html>
